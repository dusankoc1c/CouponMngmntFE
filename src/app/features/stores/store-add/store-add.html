<a routerLink="/stores" class="back-link">&larr; Nazad na prodavnice</a>

<h1>Nova prodavnica</h1>

@if (errorMessage() !== '') {
  <p class="error">{{ errorMessage() }}</p>
}

<form [formGroup]="form" (ngSubmit)="onSubmit()" class="add-form">
  <label>Naziv prodavnice</label>
  <input type="text" formControlName="name">

  <label>Opis</label>
  <textarea formControlName="description" rows="4"></textarea>

  <div class="modal-actions">
    <button type="button" class="btn btn-secondary" routerLink="/stores">Otkazi</button>
    <button type="submit" class="btn btn-primary" [disabled]="isSaving()">Sacuvaj prodavnicu</button>
  </div>
</form>
