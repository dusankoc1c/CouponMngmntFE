<div class="modal-overlay">
  <div class="modal-box">
    <h2>Export Coupons</h2>
    <p class="modal-subtitle">Izaberi bundle-ove za export</p>

    @if (errorMessage() !== '') {
      <p class="error">{{ errorMessage() }}</p>
    }

    <div class="filter-row">
      <div>
        <label>Datum kreiranja</label>
        <input type="date" [(ngModel)]="createdFrom" name="createdFrom">
      </div>

      <div>
        <label>Krajnji datum</label>
        <input type="date" [(ngModel)]="createdTo" name="createdTo">
      </div>
    </div>


    <div class="filter-row">
      <div>
        <label>Status kupona</label>
        <select [(ngModel)]="status" name="status">
          <option value="all">Svi</option>
          <option value="unused">Neiskorisceni</option>
          <option value="used">Iskorisceni</option>
        </select>
      </div>

      <div>
        <label>Cena od</label>
        <input type="number" step="0.01" [(ngModel)]="amountMin" name="amountMin">
      </div>

      <div>
        <label>Cena do</label>
        <input type="number" step="0.01" [(ngModel)]="amountMax" name="amountMax">
      </div>
    </div>

    <div class="bundle-list">
      @for (bundle of bundles; track bundle.id) {
        <label class="bundle-item">
          <input type="checkbox" [checked]="isBundleSelected(bundle.id)" (change)="onToggleBundle(bundle.id)">
          <span>{{ bundle.name }}</span>
        </label>
      } @empty {
        <p class="muted">Nema bundle-ova za export.</p>
      }
    </div>

    <div class="modal-actions">
      <button type="button" class="btn btn-secondary" (click)="onClearFilters()">Obrisi filtere</button>
      <button type="button" class="btn btn-secondary" (click)="onCancel()">Otkazi</button>
      <button type="button" class="btn btn-primary" [disabled]="isExporting()" (click)="onExport()">Export CSV</button>
    </div>
  </div>
</div>
